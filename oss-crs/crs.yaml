name: crs-bug-finding-codex
type:
  - bug-finding
version: 1.0.0
docker_registry: ghcr.io/team-atlanta/crs-bug-finding-codex

prepare_phase:
  hcl: oss-crs/docker-bake.hcl

target_build_phase:
  - name: default-build
    dockerfile: oss-crs/builder.Dockerfile
    outputs:
      - build
      - src
  - name: inc-builder-asan
    snapshot: true
    dockerfile: oss-crs-infra:default-builder
    additional_env:
      SANITIZER: address

crs_run_phase:
  finder:
    dockerfile: oss-crs/finder.Dockerfile
    additional_env:
      CRS_AGENT: codex
      # CODEX_MODEL: gpt-5.4
      # AGENT_TIMEOUT: "0"  # seconds, 0 = no limit (default)
  inc-builder-asan:
    run_snapshot: true
    dockerfile: oss-crs-infra:default-builder

supported_target:
  mode:
    - full
    - delta
  language:
    - c
    - c++
    - jvm
  sanitizer:
    - address
  architecture:
    - x86_64

required_llms:
  - gpt-5.4
