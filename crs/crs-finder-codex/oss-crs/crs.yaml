name: crs-finder-codex
type:
  - bug-finding
version: 1.0.0
# Local Template default. Set an explicit registry only when this derived CRS
# is intentionally published under a namespace you control.
docker_registry: local

prepare_phase:
  hcl: oss-crs/docker-bake.hcl

target_build_phase:
  - name: default-build
    dockerfile: oss-crs/builder.Dockerfile
    outputs:
      - build
      - src

crs_run_phase:
  finder:
    dockerfile: oss-crs/finder.Dockerfile
    additional_env:
      # Default values. To override, set additional_env in compose yaml.
      CRS_AGENT: codex
      # CODEX_CLI_VERSION: "0.144.3"  # Optional prepare-phase override for base image build
      # CODEX_MODEL: gpt-5.6-sol  # Optional override (default if unset)
      # CODEX_MODEL_REASONING_EFFORT: xhigh  # Optional override (default if unset)
      # AGENT_TIMEOUT: "0"  # seconds, 0 = no limit (default)

supported_target:
  mode:
    - full
    - delta
  language:
    - c
    - c++
    - jvm
  sanitizer:
    - address
  architecture:
    - x86_64

required_llms:
  - gpt-5.6-sol
