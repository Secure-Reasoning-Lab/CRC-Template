[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crs-finder-codex"
version = "1.0.0"
description = "Codex vulnerability discovery CRS for CRC-Template"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
run_finder = "finder:main"

[tool.setuptools]
py-modules = ["finder"]

[tool.setuptools.packages.find]
include = ["agents", "agents.*"]

[tool.setuptools.package-data]
agents = ["*.md", "sections/*.md", "skills/*/SKILL.md"]
