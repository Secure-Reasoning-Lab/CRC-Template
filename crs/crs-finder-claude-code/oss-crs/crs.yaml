name: crs-finder-claude-code
type:
- bug-finding
version: 1.0.0

# No prepare_phase: the runner builds FROM the framework-provided
# base_runner_image at run time and installs its own tooling.

target_build_phase:
- name: build
  dockerfile: oss-crs/dockerfiles/builder.Dockerfile
  outputs:
  - build
  - src
- name: coverage-build
  dockerfile: oss-crs/dockerfiles/coverage-builder.Dockerfile
  outputs:
  - coverage
- name: debug-build
  dockerfile: oss-crs/dockerfiles/debug-builder.Dockerfile
  outputs:
  - debug
- name: codeql-build
  dockerfile: oss-crs/dockerfiles/codeql-builder.Dockerfile
  outputs:
  - codeql

crs_run_phase:
  main:
    dockerfile: oss-crs/dockerfiles/runner.Dockerfile
    additional_env:
      # Defaults; override in the compose file's additional_env.
      # The production entrypoint. Other upstream experiments require an
      # explicit CRS_ENABLE_EXPERIMENTAL_ENTRYPOINTS=1 opt-in.
      CRS_ENTRYPOINT: run_crs
      ANTHROPIC_MODEL: claude-opus-4-8
      # Run-module environment is not passed to target build containers. The
      # root wrapper resolves this required host secret before invoking oss-crs.
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN}"
      # AGENT_TIMEOUT: "0"   # seconds, 0 = no limit (default)

supported_target:
  mode:
  - full
  - delta
  language:
  - c
  - c++
  sanitizer:
  - address
  architecture:
  - x86_64
  fuzzing_engine:
  - libfuzzer

# Validation baseline when an LLM proxy is configured (llm_config). Ignored
# when the CRS authenticates via CLAUDE_CODE_OAUTH_TOKEN.
required_llms:
- claude-opus-4-8
- claude-sonnet-4-6
- claude-haiku-4-5-20251001

# The checked-in development compose intentionally uses Claude Code OAuth.
# A LiteLLM-backed variant should remove this requirement in its own manifest.
required_envs:
- CLAUDE_CODE_OAUTH_TOKEN
