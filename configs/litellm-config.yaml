## Claude Code speaks Anthropic model names. OSS-CRS starts LiteLLM in front
## of this config so those names can be routed to the OpenAI-compatible
## upstream without exposing its credentials to a CRS container.
model_list:
  - model_name: claude-opus-4-8
    litellm_params:
      model: openai/gpt-5.6-sol
      api_base: os.environ/LITELLM_UPSTREAM_BASE_URL
      api_key: os.environ/LITELLM_UPSTREAM_API_KEY
      reasoning_effort: high

  - model_name: claude-sonnet-5
    litellm_params:
      model: openai/gpt-5.6-terra
      api_base: os.environ/LITELLM_UPSTREAM_BASE_URL
      api_key: os.environ/LITELLM_UPSTREAM_API_KEY
      reasoning_effort: high

  - model_name: claude-haiku-4-5
    litellm_params:
      model: openai/gpt-5.6-luna
      api_base: os.environ/LITELLM_UPSTREAM_BASE_URL
      api_key: os.environ/LITELLM_UPSTREAM_API_KEY
      reasoning_effort: high
