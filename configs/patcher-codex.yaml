run_env: local
docker_registry: local

oss_crs_infra:
  cpuset: "0-1"
  memory: "8G"

llm_config:
  litellm:
    mode: internal
    model_check: false
    internal:
      config_path: configs/litellm-config.yaml

crs-patcher-codex:
  source:
    local_path: crs/crs-patcher-codex
  cpuset: "2-7"
  memory: "16G"
  llm_budget: 30
  additional_env:
    CRS_AGENT: codex
    CODEX_MODEL: gpt-5.5
    CODEX_MODEL_REASONING_EFFORT: xhigh
