run_env: local
docker_registry: local

# The framework services use the first two CPUs. The patcher gets the remaining
# six CPUs on the default eight-core local development host.
oss_crs_infra:
  cpuset: "0-1"
  memory: "8G"

crs-patcher-claude-code:
  source:
    # OSS-CRS resolves local_path from the process working directory. All root
    # scripts cd to the CRC-Template root before invoking oss-crs.
    local_path: crs/crs-patcher-claude-code
  cpuset: "2-7"
  memory: "16G"
  # For private aliases LiteLLM's cost table can be approximate. Treat this as
  # a circuit breaker rather than the upstream provider's billing authority.
  llm_budget: 10
  additional_env:
    ANTHROPIC_MODEL: claude-opus-4-8
    CLAUDE_CODE_SUBAGENT_MODEL: claude-sonnet-5
    ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-4-8
    ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-5
    ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5
    CLAUDE_CODE_EFFORT_LEVEL: high
    CLAUDE_CODE_ALWAYS_ENABLE_EFFORT: "1"

# Default: OSS-CRS starts and meters an internal LiteLLM proxy.
# To use Claude Code OAuth instead, comment out this entire llm_config block,
# set CLAUDE_CODE_OAUTH_TOKEN, and run the wrapper with --auth-mode oauth.
# Without llm_config, the llm_budget above is not enforced; use an account-side
# spending limit.
llm_config:
  litellm:
    mode: internal
    internal:
      config_path: configs/litellm-config.yaml
