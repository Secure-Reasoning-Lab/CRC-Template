run_env: local
docker_registry: local

oss_crs_infra:
  cpuset: "0-1"
  memory: "8G"

# For Claude Code OAuth, comment out this block and use --auth-mode oauth.
llm_config:
  litellm:
    mode: internal
    model_check: false
    internal:
      config_path: configs/litellm-config.yaml

crs-patcher-claude-code:
  source:
    local_path: crs/crs-patcher-claude-code
  cpuset: "2-7"
  memory: "16G"
  llm_budget: 30
  additional_env:
    ANTHROPIC_MODEL: gpt-5.5
    CLAUDE_CODE_SUBAGENT_MODEL: gpt-5.4
    ANTHROPIC_DEFAULT_OPUS_MODEL: gpt-5.5
    ANTHROPIC_DEFAULT_SONNET_MODEL: gpt-5.4
    ANTHROPIC_DEFAULT_HAIKU_MODEL: gpt-5.4-mini
    CLAUDE_CODE_EFFORT_LEVEL: high
    CLAUDE_CODE_ALWAYS_ENABLE_EFFORT: "1"
